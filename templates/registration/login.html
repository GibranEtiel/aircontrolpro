{% load static %}<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Air Control Pro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="text-center mb-4">
      <i class="bi bi-snow2 text-info" style="font-size:3rem"></i>
      <h1 class="h3 mt-2">Air Control <span class="text-info">Pro</span></h1>
      <p class="text-body-secondary mb-0">Portal de mantenciones y climatización</p>
    </div>
    <div class="card"><div class="card-body p-4">
      <form method="post">{% csrf_token %}
        {% if form.errors %}<div class="alert alert-danger py-2">Usuario o contraseña incorrectos.</div>{% endif %}
        <div class="mb-3">
          <label class="form-label" for="id_username">Usuario</label>
          <input type="text" name="username" id="id_username" class="form-control" autofocus autocapitalize="none" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="id_password">Contraseña</label>
          <input type="password" name="password" id="id_password" class="form-control" required>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-info w-100">Ingresar</button>
      </form>
    </div></div>
  </div>
</div>
</body>
</html>
