{% load static %}<!doctype html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>{% block title %}Air Control Pro{% endblock %} · Air Control Pro</title>
  <link rel="icon" href="{% static 'img/mark.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Newsreader:ital,wght@1,500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/app.css' %}?v={{ v_estatica }}" rel="stylesheet">
</head>
<body>
<header class="login-nav">
  <a class="brand p-0" href="{% url 'login' %}">
    <img src="{% static 'img/mark.png' %}" alt="">
    <div><strong>AirControl <b>Pro</b></strong><small>Climatización y refrigeración</small></div>
  </a>
  <a class="login-nav-link" href="{% url 'login' %}"><i class="bi bi-arrow-left"></i> <span>Volver a ingresar</span></a>
</header>
<main class="auth-main">
  <div class="login-card">
    <div class="card"><div class="card-body p-4 p-md-5">
      {% block panel %}{% endblock %}
    </div></div>
  </div>
</main>
</body>
</html>
